# Encrypted labelling shards (MAGMa trees + subformulae) for the ICEBERG fine-tune: input = one encrypted tar in a private Kaggle dataset,
# output = one encrypted archive per shard in a private Kaggle dataset. Logs carry counts and timings only. Trigger: workflow_dispatch.
name: magma-label
on:
  workflow_dispatch:
    inputs:
      shards:
        description: JSON list of shard indices i (records = labels.iloc[i::n])
        default: '[0]'
        required: true
      n:
        description: number of shards n
        default: '12'
        required: true
      inDs:
        description: private Kaggle dataset holding the encrypted input tar
        default: nicholasooo/casmi-c1-ft-pilot-enc
        required: true
      inFile:
        description: encrypted input file name inside inDs
        default: ft_pilot.tar.enc
        required: true
      dsPrefix:
        description: output dataset slug prefix (-> nicholasooo/<prefix>-s<ii>)
        default: casmi-c1-ftlab
        required: true
      workers:
        default: '4'
        required: true
      inner:
        description: shard passed to labelShard (i/n; use 0/1 when the input tar holds only this shard)
        default: ''
        required: false
permissions:
  contents: read
jobs:
  label:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        shard: ${{ fromJSON(inputs.shards) }}
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      CASMI_ENC_KEY: ${{ secrets.CASMI_ENC_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: tools
        run: sudo apt-get install -y -qq zstd >/dev/null && curl -LsSf https://astral.sh/uv/install.sh | sh >/dev/null 2>&1 && nproc && free -g | head -2 && df -h "$RUNNER_TEMP" | tail -1
      - name: label shard ${{ matrix.shard }}
        run: SHARD=${{ matrix.shard }} N=${{ inputs.n }} IN_DS=${{ inputs.inDs }} IN_FILE=${{ inputs.inFile }} DSPREFIX=${{ inputs.dsPrefix }} WORKERS=${{ inputs.workers }} INNER="${{ inputs.inner }}" ROOT="$RUNNER_TEMP/ftlab" bash jobs/magma_label/run_enc.sh
