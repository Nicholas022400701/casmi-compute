# Metric keys (RDKit 2026.03.3 tautomer-canonical InChIKey14) for sub-chunks of a public structure pool (COCONUT/LOTUS/train InChIKeys),
# one matrix job per chunk. Input: private Kaggle dataset (pre-staged pool). Output: one private Kaggle dataset per chunk.
# Public data only; logs print counts and timings. Trigger: workflow_dispatch (API or UI).
name: tiera-keys
on:
  workflow_dispatch:
    inputs:
      chunks:
        description: JSON list of chunk offsets (pool.gather_every(nchunks, offset=chunk))
        default: '[3,7,11,15,19,23,27,31,35,39,43,47]'
        required: true
      nchunks:
        description: number of chunks the pool is split into
        default: '48'
        required: true
      dsPrefix:
        description: output dataset slug prefix (-> nicholasooo/<prefix>-w<chunk>)
        default: casmi-c1-tierakeys
        required: true
      limit:
        description: row limit per chunk (0 = all; use e.g. 500 for a smoke test)
        default: '0'
        required: false
permissions:
  contents: read
jobs:
  keys:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        chunk: ${{ fromJSON(inputs.chunks) }}
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: install
        run: pip install -q rdkit==2026.3.3 polars pyarrow kaggle && nproc && free -g | head -2
      - name: key chunk ${{ matrix.chunk }}
        run: python jobs/tiera_keys/worker.py --chunk ${{ matrix.chunk }} --nchunks ${{ inputs.nchunks }} --procs 4 --work "$RUNNER_TEMP/w" --ds-prefix ${{ inputs.dsPrefix }} --limit ${{ inputs.limit }}
