# ICEBERG CPU scoring of a sharded job table (private Kaggle dataset) -> private per-shard Kaggle datasets.
# Same wrapper as the sandbox pool (jobs/iceberg_score/run.sh); logs print counts and timings only.
name: iceberg-score
on:
  workflow_dispatch:
    inputs:
      shards:   {description: 'JSON list of shard ids, e.g. [7,16]', required: true}
      n:        {description: 'number of shards the job table is split into', required: true}
      jobsDs:   {description: 'private Kaggle dataset holding the job table', required: true}
      jobsFile: {description: 'job table parquet file name', required: true}
      dsprefix: {description: 'output dataset prefix (nicholasooo/<prefix>-sNN)', required: true}
      chunk:    {description: 'jobs per chunk file', default: '512'}
      ckptMin:  {description: 'minutes between checkpoint uploads', default: '10'}
      threads:  {description: 'torch threads', default: '4'}
permissions:
  contents: read
jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        shard: ${{ fromJSON(inputs.shards) }}
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: score shard
        run: |
          ROOT=$HOME/ice JOBS_DS='${{ inputs.jobsDs }}' JOBS_FILE='${{ inputs.jobsFile }}' SHARD='${{ matrix.shard }}' N='${{ inputs.n }}' \
          DSPREFIX='${{ inputs.dsprefix }}' CHUNK='${{ inputs.chunk }}' CKPT_MIN='${{ inputs.ckptMin }}' THREADS='${{ inputs.threads }}' \
          bash jobs/iceberg_score/run.sh
